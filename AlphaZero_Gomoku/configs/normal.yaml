# Search
n_simulations: 200
c_puct: 1.5
dirichlet_alpha: 0.15
dirichlet_eps: 0.25
temp_moves: 15

# Self-play
rule_set: normal
parallel_games: 16
pi_target_temp: 1.0
move_time_budget_sec: null

# Training
n_iter: 20
games_per_iter: 50
buffer_size: 50000
train_steps_per_iter: 200
batch_size: 128
learning_rate: 1.0e-3
optimizer: adam
weight_decay: 1.0e-4
value_loss_weight: 1.0
policy_loss_weight: 1.0
lr_schedule: cosine
eval_fixed_batch_size: 512
checkpoint_buffer: true
log_moves: false

# Evaluation
arena_win_threshold: 0.55

# Model
n_blocks: 6
n_filters: 64
